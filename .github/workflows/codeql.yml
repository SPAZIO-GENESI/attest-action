# Analisi statica del codice (CodeQL), linguaggio "actions": analizza i
# workflow e le composite action per injection via input non fidati.
# Alert su Security > Code scanning. Triage settimanale: vedi
# PRC-security-alert-triage nel registro gtf (owner it@spaziogenesi.org,
# esecutore Federico Battisti) — voce A3 del piano P43, parte 2; copertura
# estesa a questo repo con P54/F5.
#
# Questo repo non ha codice applicativo (e' una composite action, solo
# action.yml + shell): "actions" e' l'unico linguaggio pertinente.

name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: actions

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:actions"
