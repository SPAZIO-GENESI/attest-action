name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Runs on every push/PR: read-only checks only (no credential, no quota
  # spent) — a canary that the pinned CLI still starts and behaves as this
  # action expects it to, before anyone merges a change to action.yml.
  #
  # ⚠️ Every step must assert on the CLI's OUTPUT, never on its exit code
  # alone. The first version of this job only ran the commands, and went
  # green against a 0.3.0 CLI that exited 0 while printing nothing at all
  # (broken bin entry point) — a blind canary is worse than none.
  smoke-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: sg-attest --version reports the pinned version
        run: |
          set -euo pipefail
          actual="$(npx -y -p @spazio-genesi/attest-mcp@0.3.1 sg-attest --version)"
          echo "actual=${actual}"
          test "${actual}" = "0.3.1"

      - name: sg-attest --help prints usage
        run: |
          set -euo pipefail
          npx -y -p @spazio-genesi/attest-mcp@0.3.1 sg-attest --help | grep -q "Uso: sg-attest"

      - name: sg-attest status (read-only, no credential)
        run: |
          set -euo pipefail
          npx -y -p @spazio-genesi/attest-mcp@0.3.1 sg-attest status --json \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const s=JSON.parse(d);if(!s.worker)throw new Error('no worker field');console.log('worker:',s.worker);});"

      - name: sg-attest verify on a fixture (read-only, no credential)
        run: |
          set -euo pipefail
          npx -y -p @spazio-genesi/attest-mcp@0.3.1 sg-attest verify test/fixtures/sample.txt --json \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const v=JSON.parse(d);if(!/^[0-9a-f]{64}$/.test(v.hash_calcolato_locale||''))throw new Error('no local hash in output');console.log('hash:',v.hash_calcolato_locale);});"

  # Only on a manual run: ONE real attestation through the local action
  # (uses: ./), spending one unit of quota — never on every push (see README
  # "Cost of running this"). The operator sets the SG_API_KEY secret (F3).
  self-test-attest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Attest the fixture for real
        id: attest
        uses: ./
        with:
          files: test/fixtures/sample.txt
          api-key: ${{ secrets.SG_API_KEY }}
          title: "attest-action self-test"
          note: "Automated self-test run, safe to ignore — ${{ github.repository }}#${{ github.run_id }}"

      - name: Check outputs are non-empty
        run: |
          set -euo pipefail
          test -n "${{ steps.attest.outputs.sha256 }}"
          test -n "${{ steps.attest.outputs.certificate-url }}"
          echo "Attested: ${{ steps.attest.outputs.certificate-url }}"

      # The link the action advertises must actually resolve. It only does
      # if the certificate was minted and archived — an attestation that
      # merely signs a fingerprint leaves /c/<hash> a 404, and this step is
      # what stops us from shipping that link again.
      - name: The permanent verification page resolves
        run: |
          set -euo pipefail
          url="${{ steps.attest.outputs.certificate-url }}"
          code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$url")"
          echo "$url -> $code"
          test "$code" = "200"
